name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.18.0

      - name: Verify tag and package version
        id: package
        env:
          TAG: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          VERSION=$(node --print "require('./package.json').version")
          test "$TAG" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source and package
        run: bun run check

      - name: Verify package contents
        run: bun run pack:dry-run

      - name: Publish package
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "becomes@$VERSION" version >/dev/null 2>&1; then
            echo "becomes@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>release-error.log; then
            exit 0
          fi
          if ! grep -q "HTTP 404" release-error.log; then
            cat release-error.log >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
